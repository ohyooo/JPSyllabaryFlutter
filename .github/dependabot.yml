version: 2

updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Asia/Shanghai
    groups:
      flutter-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "00:15"
      timezone: Asia/Shanghai
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:30"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
